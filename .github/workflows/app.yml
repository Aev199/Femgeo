name: App

# Только ручной запуск: сборка переносного exe для Windows (Tauri, один файл).
on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: app/src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Tests
        run: cargo test --release --locked

      - name: Build UI
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      - name: Build executable
        working-directory: app/src-tauri
        run: npx --prefix ../ui tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: femgeo-windows
          path: app/src-tauri/target/release/femgeo-app.exe
          retention-days: 7

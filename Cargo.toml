[package]
name = "femgeo"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Подбор расстановки свай и армирования по расчёту на грунтовом основании"
publish = false

[dependencies]
# Разреженное разложение Холецкого
faer = "0.22"
# Чтение объектов geobase (SQLite), только чтение
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3

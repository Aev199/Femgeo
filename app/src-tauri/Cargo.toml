[package]
name = "femgeo-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Femgeo: подбор расстановки свай и армирования"

# Отдельно: тесты и CI основного крейта оболочку не собирают.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
femgeo = { path = "../.." }

[profile.release]
opt-level = 3
codegen-units = 1
panic = "unwind"
